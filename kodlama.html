<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodlama Bilgisi Testi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #quiz-container {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #1a73e8;
        }

        #question-container {
            margin-bottom: 20px;
        }

        #options button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #options button:hover {
            background-color: #155ab6;
        }

        #result {
            display: none;
        }

        #result h2 {
            color: #34a853;
        }

        #restart-btn {
            background-color: #fbbc04;
            margin-top: 15px;
        }

        #restart-btn:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>
    <div id="quiz-container">
        <h1>Kodlama Bilgisi Testi</h1>
        <div id="question-container">
            <p id="question"></p>
            <div id="options"></div>
        </div>
        <div id="result">
            <h2>Sonuç</h2>
            <p id="score"></p>
            <p id="time"></p>
            <button id="restart-btn" onclick="restartQuiz()">Yeniden Başlat</button>
        </div>
    </div>

    <script>
        const questions = [
            // Python Soruları
            { question: "Python'da bir listeyi nasıl tanımlarsınız?", options: ["[]", "{}", "()"], answer: "[]" },
            { question: "Python'da döngü için hangi anahtar kelimeyi kullanırsınız?", options: ["for", "loop", "while"], answer: "for" },
            { question: "Python'da bir fonksiyon nasıl tanımlanır?", options: ["function()", "def function():", "fun function()"], answer: "def function():" },
            { question: "Python'da veri tipi listesi için hangisi doğrudur?", options: ["int", "str", "list"], answer: "list" },
            { question: "Python'da değişken ismi hangi karakterle başlayabilir?", options: ["Harf", "Rakamsal karakter", "Özel karakter"], answer: "Harf" },

            // Arduino Soruları
            { question: "Arduino'da bir LED'i yakmak için hangi fonksiyon kullanılır?", options: ["digitalWrite", "analogWrite", "pinMode"], answer: "digitalWrite" },
            { question: "Arduino'da sabit değerleri tanımlamak için hangi anahtar kelime kullanılır?", options: ["const", "let", "int"], answer: "const" },
            { question: "Hangi Arduino kartı en küçüğüdür?", options: ["Nano", "Mega", "Uno"], answer: "Nano" },
            { question: "Arduino IDE hangi programlama diline dayanır?", options: ["C/C++", "Python", "Java"], answer: "C/C++" },
            { question: "Arduino'da 0 veya 1 olarak tanımlanan dijital pin değerine ne denir?", options: ["HIGH/LOW", "TRUE/FALSE", "ON/OFF"], answer: "HIGH/LOW" },

            // Scratch Soruları
            { question: "Scratch'te karakterlere ne ad verilir?", options: ["Kukla", "Kod", "Sahne"], answer: "Kukla" },
            { question: "Scratch'te olay başlatma bloğu hangisidir?", options: ["Yeşil bayrağa tıklanınca", "Sonsuz döngü", "Mesaj gönder"], answer: "Yeşil bayrağa tıklanınca" },
            { question: "Scratch'te karakterin görünümünü değiştiren blok hangisidir?", options: ["Kostüm değiştir", "Sahne değiştir", "Hareket et"], answer: "Kostüm değiştir" },
            { question: "Scratch'te ses eklemek için hangi kategori kullanılır?", options: ["Ses", "Görünüm", "Hareket"], answer: "Ses" },
            { question: "Scratch'te tekrar eden işlemler için hangi blok türü kullanılır?", options: ["Döngü", "Koşul", "Olay"], answer: "Döngü" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let startTime;

        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('question').textContent = question.question;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            question.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(option);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedAnswer) {
            const correctAnswer = questions[currentQuestionIndex].answer;

            if (selectedAnswer === correctAnswer) {
                score++;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const endTime = new Date().getTime();
            const totalTime = ((endTime - startTime) / 1000).toFixed(2);

            document.getElementById('question-container').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            document.getElementById('score').textContent = `Puanınız: ${score} / ${questions.length}`;
            document.getElementById('time').textContent = `Geçen Süre: ${totalTime} saniye`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            startTime = new Date().getTime();
            document.getElementById('question-container').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            loadQuestion();
        }

        // Başlat
        startTime = new Date().getTime();
        loadQuestion();
    </script>
</body>
</html>
