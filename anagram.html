<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilişim Terimleri Anagram Oyunu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f8ff;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #007bff;
        }
        .anagram-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .anagram-letter {
            background-color: #007bff;
            color: white;
            font-size: 1.5rem;
            padding: 15px;
            margin: 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .anagram-letter:hover {
            transform: scale(1.2);
        }
        .answer-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .answer-box {
            width: 60px;
            height: 60px;
            margin: 5px;
            background-color: #f8f9fa;
            border: 2px solid #007bff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .answer-box.correct {
            background-color: #28a745;
            color: white;
        }
        .answer-box.incorrect {
            background-color: #dc3545;
            color: white;
        }
        .game-info {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 20px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 7px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .correct-answer {
            font-size: 1.3rem;
            font-weight: bold;
            color: #dc3545;
            margin-top: 20px;
            text-align: center;
        }
        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }
        .feedback.correct {
            color: #28a745;
        }
        .feedback.incorrect {
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Bilişim Terimleri Anagram Oyunu</h1>
    <div class="anagram-container" id="letters-container"></div>
    <div class="answer-container" id="answer-container"></div>
    <div class="game-info">
        <button class="btn" onclick="resetGame()">Yeniden Başlat</button>
        <button class="btn" onclick="checkFinalAnswer()">Cevabı Kontrol Et</button>
        <button class="btn" onclick="showHint()">Kopya Ver</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="correct-answer" id="correct-answer"></div>
</div>

<script>
    const terms = [
        "Yazılım", "Veritabanı", "Ağ", "Algoritma", "Programlama", "Internet",
        "Donanım", "Web", "Mobil", "Python", "JavaScript", "HTML", "CSS", "Java", 
        "Robotik", "Yapay Zeka"
    ];
    let selectedTerm = terms[Math.floor(Math.random() * terms.length)];
    let shuffledTerm = shuffleTerm(selectedTerm);
    let answer = new Array(selectedTerm.length).fill(null);

    // HTML öğelerini alalım
    const lettersContainer = document.getElementById("letters-container");
    const answerContainer = document.getElementById("answer-container");
    const correctAnswerContainer = document.getElementById("correct-answer");
    const feedbackContainer = document.getElementById("feedback");

    // Terimi karıştır
    function shuffleTerm(term) {
        let shuffled = term.split('');
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.join('');
    }

    // Anagram harflerini yerleştir
    function displayShuffledLetters() {
        lettersContainer.innerHTML = '';
        shuffledTerm.split('').forEach(letter => {
            const letterElement = document.createElement("div");
            letterElement.classList.add("anagram-letter");
            letterElement.textContent = letter;
            letterElement.setAttribute("data-letter", letter);
            letterElement.addEventListener("click", handleLetterClick);
            lettersContainer.appendChild(letterElement);
        });
    }

    // Cevap kutularını oluştur
    function displayAnswerBoxes() {
        answerContainer.innerHTML = '';
        answer.forEach((_, index) => {
            const boxElement = document.createElement("div");
            boxElement.classList.add("answer-box");
            boxElement.setAttribute("data-index", index);
            boxElement.addEventListener("click", handleAnswerBoxClick);
            answerContainer.appendChild(boxElement);
        });
    }

    // Harf tıklama fonksiyonu
    function handleLetterClick(event) {
        const letter = event.target.textContent;
        const availableIndex = answer.indexOf(null);
        if (availableIndex !== -1) {
            answer[availableIndex] = letter;
            event.target.style.display = "none"; // Tıklanan harfi gizle
            updateAnswerBoxes();
        }
    }

    // Cevap kutusu tıklama fonksiyonu
    function handleAnswerBoxClick(event) {
        const index = event.target.getAttribute("data-index");
        if (answer[index] !== null) {
            const letter = answer[index];
            answer[index] = null;
            displayShuffledLetters();
            updateAnswerBoxes();
        }
    }

    // Cevap kutularını güncelle
    function updateAnswerBoxes() {
        const boxes = document.querySelectorAll(".answer-box");
        answer.forEach((letter, index) => {
            boxes[index].textContent = letter || '';
        });
    }

    // Cevap kontrolü
    function checkFinalAnswer() {
        const currentAnswer = answer.join('');
        if (currentAnswer === selectedTerm) {
            feedbackContainer.textContent = "Doğru!";
            feedbackContainer.classList.add("correct");
            feedbackContainer.classList.remove("incorrect");
        } else {
            feedbackContainer.textContent = "Yanlış, tekrar deneyin!";
            feedbackContainer.classList.add("incorrect");
            feedbackContainer.classList.remove("correct");
        }
    }

    // Kopya Ver (Doğru kelimeyi göster)
    function showHint() {
        correctAnswerContainer.textContent = `Doğru Kelime: ${selectedTerm}`;
    }

    // Doğru kelimeyi göster
    function showCorrectAnswer() {
        correctAnswerContainer.textContent = `Doğru Kelime: ${selectedTerm}`;
    }

    // Oyunu sıfırlama
    function resetGame() {
        selectedTerm = terms[Math.floor(Math.random() * terms.length)];
        shuffledTerm = shuffleTerm(selectedTerm);
        answer = new Array(selectedTerm.length).fill(null);
        displayShuffledLetters();
        displayAnswerBoxes();
        correctAnswerContainer.textContent = ''; // Cevap temizlenir
        feedbackContainer.textContent = ''; // Geri bildirim temizlenir
    }

    // Sayfa yüklendiğinde oyun başlasın
    window.onload = () => {
        displayShuffledLetters();
        displayAnswerBoxes();
    };
</script>
</body>
</html>
