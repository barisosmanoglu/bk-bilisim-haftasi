<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span style="color: #3776AB; font-weight: bold;">Python Kod Sıralama Oyunu</span> 🐍</title>
    <style>
        body {
            font-family: 'Consolas', Monaco, 'Courier New', Courier, monospace; /* Kod fontu */
            text-align: center;
            background-color: #f0f0f0; /* Açık gri arka plan */
            color: #333;
            padding-top: 30px;
        }
        h1 {
            color: #3776AB; /* Python mavisi */
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 10px;
        }
        #questionCount {
            font-size: 1.2em;
            color: #E9D44A; /* Python sarısı */
            font-weight: bold;
        }
        .code-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .code-block {
            padding: 12px 15px;
            margin: 8px;
            border: 1px solid #ccc;
            cursor: grab; /* Daha belirgin sürükleme imleci */
            width: 300px;
            text-align: left;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1); /* Hafif gölge */
            font-size: 1em;
            white-space: nowrap; /* Kodların tek satırda kalması için */
            overflow: hidden; /* Taşmayı gizle */
            text-overflow: ellipsis; /* Taşan kod için ... göster */
        }
        .code-block:active {
            cursor: grabbing;
        }
        #message {
            font-size: 1.2em;
            margin-top: 15px;
            font-weight: bold;
        }
        #message.correct {
            color: #4CAF50; /* Yeşil */
        }
        #message.incorrect {
            color: #F44336; /* Kırmızı */
        }
        #score {
            font-size: 1.1em;
            margin-top: 10px;
            color: #4CAF50;
        }
        #restart, #checkOrder {
            font-size: 1.1em;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            background-color: #3776AB; /* Python mavisi */
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        #restart:hover, #checkOrder:hover {
            background-color: #265985;
        }
    </style>
</head>
<body>
    <h1><span style="color: #3776AB; font-weight: bold;">Python Kod Sıralama Oyunu</span> 🐍</h1>
    <p>Blokları doğru sıralayarak kodu çalıştır!</p>
    <p id="questionCount">Soru: 1 / 10</p>
    <div class="code-container" id="codeBlocks"></div>
    <button id="checkOrder">Sırayı Kontrol Et</button>
    <p id="message"></p>
    <p id="score">✅ Doğru cevaplar: <span id="correctAnswers">0</span></p>
    <button id="restart">🔄 Yeniden Başlat</button>

    <script>
        const questions = [
            ["name = 'Ali'", "print('Merhaba ' + name)"],
            ["age = 12", "print('Yaş: ' + str(age))"],
            ["for i in range(5):", "    print('Python')"],
            ["def kare(x):", "    return x * x", "print(kare(3))"],
            ["sayilar = [1, 2, 3]", "for s in sayilar:", "    print(s)"],
            ["def topla(a, b):", "    return a + b", "print(topla(2, 3))"],
            ["x = 5", "if x > 3:", "    print('Büyük')"],
            ["kelime = 'Merhaba'", "print(kelime.lower())"],
            ["def ters_cevir(metin):", "    return metin[::-1]", "print(ters_cevir('Kod'))"],
            ["sebzeler = ['domates', 'biber', 'patlıcan']", "sebzeler.append('kabak')", "print(sebzeler)"]
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        const messageElement = document.getElementById("message");

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function displayCodeBlocks() {
            const container = document.getElementById("codeBlocks");
            container.innerHTML = "";
            const correctOrder = questions[currentQuestionIndex];
            shuffle(correctOrder);

            correctOrder.forEach(code => {
                let div = document.createElement("div");
                div.classList.add("code-block");
                div.textContent = code;
                div.draggable = true;
                container.appendChild(div);
            });

            let draggedItem = null;
            document.querySelectorAll(".code-block").forEach(block => {
                block.addEventListener("dragstart", function () {
                    draggedItem = this;
                    this.style.opacity = '0.5'; // Sürüklenirken hafif soluklaşma
                });

                block.addEventListener("dragend", function () {
                    this.style.opacity = '1'; // Sürükleme bittiğinde eski opaklığa dön
                    draggedItem = null;
                });

                block.addEventListener("dragover", function (event) {
                    event.preventDefault();
                });

                block.addEventListener("dragenter", function () {
                    this.style.border = '2px dashed #ccc'; // Üzerine sürüklenirken farklı bir kenarlık
                });

                block.addEventListener("dragleave", function () {
                    this.style.border = '1px solid #ccc'; // Dışına çıkıldığında eski kenarlık
                });

                block.addEventListener("drop", function () {
                    if (draggedItem) {
                        let parent = draggedItem.parentNode;
                        parent.insertBefore(draggedItem, this.nextSibling);
                        this.style.border = '1px solid #ccc'; // Bırakıldıktan sonra eski kenarlık
                    }
                });
            });
        }

        function checkOrder() {
            let blocks = document.querySelectorAll(".code-block");
            let currentOrder = Array.from(blocks).map(block => block.textContent);
            let correctOrder = questions[currentQuestionIndex];

            if (JSON.stringify(currentOrder) === JSON.stringify(correctOrder)) {
                score++;
                document.getElementById("correctAnswers").textContent = score;
                messageElement.textContent = "✅ Doğru!";
                messageElement.className = "correct"; // Yeşil mesaj sınıfı
                setTimeout(nextQuestion, 1500); // 1.5 saniye sonra sonraki soru
            } else {
                messageElement.textContent = "❌ Yanlış sıralama! Tekrar dene.";
                messageElement.className = "incorrect"; // Kırmızı mesaj sınıfı
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                document.getElementById("questionCount").textContent = `Soru: ${currentQuestionIndex + 1} / 10`;
                messageElement.textContent = "";
                messageElement.className = "";
                displayCodeBlocks();
            } else {
                messageElement.textContent = `🎉 Oyun Bitti! ✅ Doğru cevaplar: ${score} / 10`;
                messageElement.className = "correct";
            }
        }

        document.getElementById("checkOrder").addEventListener("click", checkOrder);
        document.getElementById("restart").addEventListener("click", function () {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById("questionCount").textContent = "Soru: 1 / 10";
            document.getElementById("correctAnswers").textContent = score;
            messageElement.textContent = "";
            messageElement.className = "";
            displayCodeBlocks();
        });

        displayCodeBlocks();
    </script>
</body>
</html>
