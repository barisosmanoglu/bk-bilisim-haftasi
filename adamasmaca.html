<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilişim Adam Asmaca Oyunu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            text-align: center;
        }

        .game-container {
            width: 80%;
            max-width: 600px;
            margin: 20px;
        }

        .word-container {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .letter-button {
            width: 40px;
            height: 40px;
            font-size: 1.25rem;
            margin: 5px;
        }

        .wrong-letters {
            margin-top: 10px;
            color: red;
        }

        .hangman-image {
            width: 200px;
            margin-top: 20px;
        }

        .alphabet-container {
            margin-top: 20px;
        }

        .alphabet-button {
            margin: 3px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Adam Asmaca</h1>
    <div class="word-container" id="word-container"></div>
    <div class="alphabet-container" id="alphabet-container">
        <!-- Harf butonları burada olacak -->
    </div>
    <div class="wrong-letters" id="wrong-letters"></div>
    <div id="hangman-container">
        <img id="hangman-image" class="hangman-image" src="img/bahcesehir-logo.png" alt="Hangman">
    </div>
    <div class="button-container">
        <button class="btn btn-secondary" onclick="startGame()">Yeni Oyun Başlat</button>
    </div>
    <div id="message"></div>
</div>

<script>
    const words = ["Yazılım", "Programlama", "Veritabanı", "Ağ", "Algoritma", "YapayZeka", "Internet", "Bilişim", "Dijital", "Donanım"];
    let selectedWord, guessedLetters, wrongLetters, attemptsLeft;

    const wordContainer = document.getElementById("word-container");
    const alphabetContainer = document.getElementById("alphabet-container");
    const wrongLettersContainer = document.getElementById("wrong-letters");
    const hangmanImage = document.getElementById("hangman-image");
    const messageContainer = document.getElementById("message");

    // Yeni oyunu başlat
    function startGame() {
        selectedWord = words[Math.floor(Math.random() * words.length)];
        guessedLetters = [];
        wrongLetters = [];
        attemptsLeft = 6;

        wordContainer.innerHTML = "";
        wrongLettersContainer.innerHTML = "";
        messageContainer.innerHTML = "";
        hangmanImage.src = "hangman0.png";

        // Gösterilecek harfler
        for (let i = 0; i < selectedWord.length; i++) {
            guessedLetters.push("_");
        }
        displayWord();
        generateAlphabet();
    }

    // Harfleri görüntüle
    function displayWord() {
        wordContainer.innerHTML = guessedLetters.join(" ");
    }

    // Yanlış harfleri görüntüle
    function updateWrongLetters() {
        wrongLettersContainer.innerHTML = "Yanlış Harfler: " + wrongLetters.join(", ");
    }

    // Asma adamı güncelle
    function updateHangman() {
        hangmanImage.src = `hangman${6 - attemptsLeft}.png`;
    }

    // Harf butonları oluşturma
    function generateAlphabet() {
        alphabetContainer.innerHTML = "";
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        
        for (let i = 0; i < alphabet.length; i++) {
            const button = document.createElement("button");
            button.classList.add("btn", "btn-light", "alphabet-button");
            button.textContent = alphabet[i];
            button.onclick = () => guessLetter(alphabet[i]);
            alphabetContainer.appendChild(button);
        }
    }

    // Harf tahmini
    function guessLetter(letter) {
        // Buton tıklanınca devre dışı bırakılır
        const buttons = document.querySelectorAll(".alphabet-button");
        buttons.forEach(btn => {
            if (btn.textContent === letter) btn.disabled = true;
        });

        if (selectedWord.toUpperCase().includes(letter)) {
            // Harf doğruysa
            for (let i = 0; i < selectedWord.length; i++) {
                if (selectedWord[i].toUpperCase() === letter) {
                    guessedLetters[i] = letter;
                }
            }
        } else {
            // Harf yanlışsa
            wrongLetters.push(letter);
            attemptsLeft--;
            updateHangman();
        }

        // Durumu güncelle
        displayWord();
        updateWrongLetters();
        checkGameStatus();
    }

    // Oyun durumu kontrolü
    function checkGameStatus() {
        if (guessedLetters.join("") === selectedWord.toUpperCase()) {
            messageContainer.innerHTML = "<p class='text-success'>Tebrikler, kazandınız!</p>";
        } else if (attemptsLeft === 0) {
            messageContainer.innerHTML = `<p class='text-danger'>Oyun Bitti! Doğru Kelime: ${selectedWord}</p>`;
        }
    }

    // Başlangıçta oyun başlat
    startGame();
</script>

<!-- Bootstrap JS & Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
