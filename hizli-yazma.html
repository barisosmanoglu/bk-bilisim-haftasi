<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Yazma Oyunu</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: linear-gradient(to right, #1e90ff, #00c6ff); color: white; }
        h1 { margin-top: 20px; font-size: 32px; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); }
        #word { font-size: 28px; font-weight: bold; margin: 20px; padding: 10px; background: #ffcc00; display: inline-block; border-radius: 10px; }
        #input { font-size: 24px; width: 250px; padding: 10px; border-radius: 5px; border: none; outline: none; }
        #timer, #score, #wrong { font-size: 20px; margin-top: 10px; font-weight: bold; }
        #restart { font-size: 18px; padding: 12px; margin-top: 20px; cursor: pointer; background: #ff4444; color: white; border: none; border-radius: 5px; }
        #input.correct { background-color: lightgreen; transition: 0.3s; }
        #input.wrong { background-color: lightcoral; transition: 0.3s; }
    </style>
</head>
<body>
    <h1>🚀 Hızlı Yazma Oyunu 🚀</h1>
    <div id="word">Kelime</div><br>
    <input type="text" id="input">
    <div id="timer">⏳ Süre: <span id="time">60</span> saniye</div>
    <div id="score">✅ Doğru Kelime Sayısı: <span id="correctWords">0</span></div>
    <div id="wrong">❌ Yanlış Kelime Sayısı: <span id="wrongWords">0</span></div>
    <button id="restart">🔄 Yeniden Başlat</button>

    <script>
        const words = ["Bilgisayar", "İnternet", "Programlama", "Veri", "Mobil", "Yazılım", "Donanım","Algoritma","Python","Arduino"];
        let time = 60;
        let score = 0;
        let wrongScore = 0;
        let timerInterval;

        function setWord() {
            document.getElementById("word").innerText = words[Math.floor(Math.random() * words.length)];
        }

        function updateTimer() {
            if (time > 0) {
                time--;
                document.getElementById("time").innerText = time;
                document.getElementById("timer").style.color = time < 10 ? "red" : "white"; // Süre azalınca kırmızı renk
                timerInterval = setTimeout(updateTimer, 1000);
            } else {
                alert(`Oyun bitti! ✅ Doğru kelime: ${score}, ❌ Yanlış kelime: ${wrongScore}`);
                clearTimeout(timerInterval);
            }
        }

        document.getElementById("input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                const currentWord = document.getElementById("word").innerText;
                if (this.value === currentWord) {
                    score++;
                    document.getElementById("correctWords").innerText = score;
                    this.classList.add("correct");
                    setTimeout(() => this.classList.remove("correct"), 500);
                } else {
                    wrongScore++;
                    document.getElementById("wrongWords").innerText = wrongScore;
                    this.classList.add("wrong");
                    setTimeout(() => this.classList.remove("wrong"), 500);
                }
                this.value = "";
                setWord();
            }
        });

        document.getElementById("restart").addEventListener("click", function() {
            time = 60;
            score = 0;
            wrongScore = 0;
            document.getElementById("time").innerText = time;
            document.getElementById("correctWords").innerText = score;
            document.getElementById("wrongWords").innerText = wrongScore;
            document.getElementById("timer").style.color = "white";
            clearTimeout(timerInterval);
            setWord();
            updateTimer();
        });

        setWord();
        updateTimer();
    </script>
</body>
</html>
